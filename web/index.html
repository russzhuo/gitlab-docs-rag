<!doctype html>
<html lang="en">
  <head>
    <link rel="icon" href="/static/favicon.png" />
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Handbook Assistant</title>
    <style>
      :root {
        font-family: ui-sans-serif, system-ui, sans-serif;
        color: #111;
        background: #f4f4f1;
      }
      body {
        max-width: 820px;
        margin: 32px auto;
        padding: 0 16px;
      }
      h1 {
        font-size: 1.25rem;
        margin: 0 0 4px;
      }
      p.sub {
        color: #555;
        margin: 0 0 20px;
      }
      .row {
        display: flex;
        gap: 8px;
        margin-bottom: 12px;
      }
      select,
      input,
      button,
      textarea {
        font: inherit;
      }
      textarea {
        width: 100%;
        min-height: 72px;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 8px;
      }
      button {
        background: #111;
        color: #fff;
        border: 0;
        border-radius: 8px;
        padding: 8px 14px;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.5;
      }
      .bubble {
        background: #fff;
        border: 1px solid #e3e3e0;
        border-radius: 10px;
        padding: 12px 14px;
        margin: 10px 0;
        white-space: pre-wrap;
      }
      .bubble.user {
        background: #ecece8;
      }
      .cite {
        font-size: 12px;
        color: #444;
        margin-top: 8px;
      }
      .cite a {
        color: #0b57d0;
      }
      .refused {
        border-color: #c9892a;
      }
      label {
        font-size: 13px;
        color: #444;
      }
    </style>
  </head>
  <body>
    <h1>Internal handbook assistant</h1>
    <p class="sub">
      Answers only from the indexed GitLab Handbook subset. If it is not in the
      docs, it should refuse.
    </p>
    <div class="row">
      <label
        >Department
        <select id="dept">
          <option value="all">all</option>
          <option value="hr">hr</option>
          <option value="finance">finance</option>
          <option value="engineering">engineering</option>
          <option value="security">security</option>
        </select>
      </label>
    </div>
    <div id="log"></div>
    <textarea
      id="q"
      placeholder="e.g. Can I expense a monitor? What if I am on-call and want PTO?"
    ></textarea>
    <div class="row"><button id="go">Ask</button></div>
    <script>
      const log = document.getElementById("log");

      // Text is always inserted with textContent (never innerHTML) so user input
      // and model output cannot inject markup.
      function addBubble(role, text, cls) {
        const d = document.createElement("div");
        d.className = "bubble " + role + (cls ? " " + cls : "");
        d.textContent = text;
        log.appendChild(d);
        return d;
      }

      function addCitations(bubble, citations) {
        (citations || []).forEach((c) => {
          const line = document.createElement("div");
          line.className = "cite";
          line.textContent = `[${c.n}] ${c.title} · ${c.department} · score ${c.score}`;
          if (c.source && /^https?:\/\//i.test(c.source)) {
            line.append(" · ");
            const a = document.createElement("a");
            a.href = c.source;
            a.target = "_blank";
            a.rel = "noopener noreferrer";
            a.textContent = "source";
            line.appendChild(a);
          }
          bubble.appendChild(line);
        });
      }

      document.getElementById("go").onclick = async () => {
        const q = document.getElementById("q").value.trim();
        if (!q) return;
        addBubble("user", q);
        document.getElementById("go").disabled = true;
        try {
          const res = await fetch("/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              question: q,
              department: document.getElementById("dept").value,
            }),
          });
          const data = await res.json();
          const text = data.error
            ? "Request failed: " + data.error
            : data.answer || "";
          const bot = addBubble("bot", text, data.refused ? "refused" : "");
          addCitations(bot, data.citations);
        } catch (e) {
          addBubble("bot", "Request failed: " + e, "refused");
        }
        document.getElementById("go").disabled = false;
        document.getElementById("q").value = "";
      };
    </script>
  </body>
</html>
